<style>

.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.big{font:700 2rem "Barlow Condensed",sans-serif;color:var(--ac)}.mu{color:var(--mu);font-size:.88rem}
button,.btn{background:var(--ac);color:var(--ink);border:0;border-radius:8px;padding:9px 16px;font:600 .95rem inherit;font-family:inherit;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:#ff5252;color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
label{display:block;margin:10px 0 3px;color:var(--mu);font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border:1px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--card)}.chip.on{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:600}
.goal{padding:22px;cursor:pointer;border:2px solid var(--bd);border-radius:14px;background:var(--card)}.goal.on{border-color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.warn{border-left:4px solid #ffb300;background:rgba(255,179,0,.1);padding:10px 14px;border-radius:8px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.grow{flex:1 1 120px!important}
.setrow input{width:70px}.ok{background:var(--ac)!important;color:var(--ink)!important}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;font-size:.9rem}

@media(max-width:760px){nav{top:auto;width:100%;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--bd);padding:6px;z-index:5;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}nav b,.nm{display:none}nav a{white-space:nowrap;padding:8px 10px}main{margin:0;padding:14px 14px 80px}h1{font-size:2rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<script>
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],B="Poids du corps",H="Haltères",M="Machines",G="Salle de sport";
const MU=["Pectoraux","Dos","Épaules","Biceps","Triceps","Avant-bras","Abdominaux","Quadriceps","Ischio-jambiers","Fessiers","Mollets","Corps complet"];
const EX=[["Développé couché","Pectoraux",G,2,"Omoplates serrées, descente contrôlée","Rebond sur la poitrine"],["Pompes","Pectoraux",B,1,"Corps gainé, coudes à 45°","Bassin qui s’affaisse"],["Développé haltères","Pectoraux",H,1,"Trajectoire en arc, poignets neutres","Amplitude trop courte"],["Pec deck","Pectoraux",M,1,"Coudes légèrement fléchis","Épaules qui montent"],
["Tractions","Dos",B,3,"Tirer les coudes vers les hanches","Élan avec les jambes"],["Rowing haltère","Dos",H,1,"Dos plat, tirer vers la hanche","Dos arrondi"],["Tirage vertical","Dos",M,1,"Poitrine sortie, tirer vers le haut du torse","Se pencher en arrière"],["Superman","Dos",B,1,"Lever bras et jambes en gainant","Cambrer le bas du dos"],
["Développé militaire haltères","Épaules",H,2,"Abdos serrés, pousser à la verticale","Dos cambré"],["Élévations latérales","Épaules",H,1,"Monter jusqu’à l’horizontale","Balancer le buste"],["Pompes pike","Épaules",B,2,"Hanches hautes, tête entre les bras","Amplitude courte"],
["Curl haltères","Biceps",H,1,"Coudes fixes le long du corps","Balancer le dos"],["Curl à la poulie","Biceps",M,1,"Contrôler la descente","Coudes qui avancent"],
["Dips sur chaise","Triceps",B,1,"Coudes vers l’arrière, dos près du banc","Épaules écrasées"],["Extension poulie","Triceps",M,1,"Coudes collés, extension complète","Coudes qui s’écartent"],["Barre au front","Triceps",G,2,"Coudes fixes","Coudes trop écartés"],
["Curl poignets","Avant-bras",H,1,"Avant-bras posés, mouvement lent","Charge trop lourde"],["Suspension à la barre","Avant-bras",B,1,"Épaules actives, tenir le plus longtemps","Épaules relâchées"],
["Crunch","Abdominaux",B,1,"Enrouler le buste, expirer en montant","Tirer sur la nuque"],["Gainage planche","Abdominaux",B,1,"Corps aligné, ventre serré","Bassin trop haut ou bas"],["Relevé de jambes","Abdominaux",B,2,"Bas du dos plaqué","Cambrer le dos"],
["Squat à la barre","Quadriceps",G,2,"Dos droit, genoux dans l’axe des pieds","Genoux qui rentrent"],["Squat poids du corps","Quadriceps",B,1,"Poids sur les talons","Talons qui décollent"],["Presse à cuisses","Quadriceps",M,1,"Ne pas verrouiller les genoux","Bassin qui décolle"],["Fentes haltères","Quadriceps",H,1,"Buste droit, genou avant stable","Pas trop court"],
["Soulevé de terre roumain","Ischio-jambiers",H,2,"Dos plat, bassin vers l’arrière","Dos arrondi"],["Leg curl","Ischio-jambiers",M,1,"Contrôler le retour","Décoller le bassin"],
["Pont fessier","Fessiers",B,1,"Pousser avec les talons, serrer en haut","Cambrer les lombaires"],["Hip thrust","Fessiers",G,2,"Menton rentré, extension complète","Hyperextension lombaire"],
["Mollets debout","Mollets",B,1,"Montée complète, pause en haut","Rebonds"],["Mollets à la presse","Mollets",M,1,"Amplitude maximale","Charge excessive"]];
const PRE={"Repos":[],"Activité légère":[],"Pectoraux + Triceps":["Pectoraux","Triceps"],"Dos + Biceps":["Dos","Biceps"],"Jambes":["Quadriceps","Ischio-jambiers","Fessiers","Mollets"],"Épaules + Abdominaux":["Épaules","Abdominaux"],"Bras + Avant-bras":["Biceps","Triceps","Avant-bras"],"Corps complet":["Corps complet"]};
const SPL={2:["Corps complet","Corps complet"],3:["Pectoraux + Triceps","Dos + Biceps","Jambes"],4:["Pectoraux + Triceps","Dos + Biceps","Jambes","Épaules + Abdominaux"],5:["Pectoraux + Triceps","Dos + Biceps","Jambes","Épaules + Abdominaux","Corps complet"],6:["Pectoraux + Triceps","Dos + Biceps","Jambes","Épaules + Abdominaux","Bras + Avant-bras","Jambes"],7:["Pectoraux + Triceps","Dos + Biceps","Jambes","Épaules + Abdominaux","Bras + Avant-bras","Jambes","Activité légère"]};
const SL=["Petit-déjeuner","Collation du matin","Déjeuner","Collation de l’après-midi","Dîner"];
// [nom, ingrédients, min, kcal, protéines g, allergènes]
const ML={gain:[[["Porridge banane-cacahuète","80 g flocons d’avoine, 250 ml lait, 1 banane, 1 c. à s. beurre de cacahuète",10,650,25,"lait arachide gluten"],["Œufs brouillés & pain complet","3 œufs, 3 tranches de pain complet, 1 fruit",10,600,30,"œuf gluten"]],[["Yaourt grec, noix & miel","200 g yaourt grec, 30 g noix, 1 c. à c. miel",3,350,18,"lait noix"],["Banane & amandes","1 banane, 30 g amandes",2,300,8,"amande noix"]],[["Poulet, riz & légumes","150 g poulet, 100 g riz cru, légumes, huile d’olive",25,800,50,""],["Pâtes bolognaise","100 g pâtes, 120 g bœuf haché, sauce tomate",25,780,42,"gluten"]],[["Sandwich thon-avocat","2 tranches pain, 1 boîte thon, ½ avocat",5,480,28,"poisson gluten"],["Smoothie lait-banane-avoine","300 ml lait, 1 banane, 40 g avoine",5,450,18,"lait gluten"]],[["Saumon, patate douce & brocolis","150 g saumon, 250 g patate douce, brocolis",30,750,40,"poisson"],["Omelette légumes & riz","3 œufs, légumes, 80 g riz cru",20,650,28,"œuf"]]],
loss:[[["Skyr, fruits rouges & flocons","200 g skyr, 100 g fruits rouges, 30 g flocons d’avoine",5,320,24,"lait gluten"],["Omelette aux épinards","2 œufs, épinards, 1 tranche pain complet",10,330,22,"œuf gluten"]],[["Pomme & amandes","1 pomme, 15 g amandes",1,170,4,"amande noix"],["Bâtonnets de légumes & houmous","carotte, concombre, 40 g houmous",5,150,6,"sésame"]],[["Salade poulet & quinoa","120 g poulet, 60 g quinoa cru, crudités, citron",20,520,40,""],["Dahl de lentilles","80 g lentilles corail, épices, lait de coco léger, riz",25,500,24,""]],[["Fromage blanc & fruit","150 g fromage blanc 0 %, 1 fruit",2,180,16,"lait"],["Œuf dur & crudités","1 œuf dur, tomates cerises, concombre",8,130,8,"œuf"]],[["Poisson blanc, légumes rôtis","150 g cabillaud, légumes de saison, 100 g pommes de terre",25,420,35,"poisson"],["Wok de légumes & tofu","150 g tofu, légumes, 60 g nouilles de riz cru",20,450,24,"soja"]]]};
const $=s=>document.querySelector(s);const mem={};
const st={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
let S;try{S=JSON.parse(st.get("ufc"))}catch(e){}S=S||{cur:0,p:[null,null],theme:"dark"};
const save=()=>st.set("ufc",JSON.stringify(S)),P=()=>S.p[S.cur];
let view="home",D={eq:[],days:[],goal:"gain"},step=0,R=null,tick=null,openDay=null,ask=null,flt={m:"",e:"",l:""},pdone=null,sumR=null;
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>iso(new Date()),tdi=()=>(new Date().getDay()+6)%7;
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}
const minor=p=>+p.age<18,gname=p=>p.goal=="gain"?"Prise de poids et musculation":"Perte de poids",lvl=p=>["Débutant","Intermédiaire","Avancé"].indexOf(p.lvl)+1||1;
function kcal(p){if(minor(p))return null;const w=+p.w,h=+p.h,a=+p.age;if(!w||!h||!a)return null;const bmr=10*w+6.25*h-5*a+(p.sex=="Homme"?5:p.sex=="Femme"?-161:-78);const t=bmr*1.5;return Math.round((p.goal=="gain"?t*1.1:t*.87)/10)*10}
function ex4(p,m){const l=lvl(p),eq=p.eq&&p.eq.length?p.eq:[B];return EX.filter(e=>e[1]==m&&e[3]<=l&&(e[2]==B||eq.includes(e[2])))}
function gen(ms,p){let L=[];ms.forEach(m=>L.push(...(m=="Corps complet"?["Pectoraux","Dos","Épaules","Quadriceps","Abdominaux"]:[m])));
const n=Math.max(L.length,Math.round((+p.dur||45)/12)),out=[],used={};let guard=0;
while(out.length<n&&guard++<80){const m=L[out.length%L.length];const o=ex4(p,m).filter(e=>!used[e[0]]);if(!o.length){if(guard>40)break;L.push(L.shift());continue}const e=o[Math.floor(Math.random()*o.length)];used[e[0]]=1;out.push(mk(e,p))}return out}
const mk=(e,p)=>({n:e[0],m:e[1],q:e[4],er:e[5],sets:lvl(p)==3?4:3,reps:p.goal=="gain"?"8-12":"12-15",rest:p.goal=="gain"?90:60,log:[]});
function mkPlan(p){const n=+p.spw||3,sp=SPL[n],av=(p.days&&p.days.length?p.days:DAYS).map(d=>DAYS.indexOf(d)).sort(),pl={};DAYS.forEach(d=>pl[d]="Repos");
const pick=av.length<=n?av:sp.map((_,i)=>av[Math.floor(i*av.length/n)]);pick.forEach((d,i)=>pl[DAYS[d]]=sp[i]||"Repos");p.plan=pl;p.det={};DAYS.forEach(d=>p.det[d]=gen(PRE[pl[d]]||[],p))}
function allergic(m,p){const a=(p.all||"").toLowerCase().split(/[ ,;]+/).filter(x=>x.length>2);return a.some(x=>m[5].includes(x)||m[0].toLowerCase().includes(x)||m[1].toLowerCase().includes(x))}
function opts(p,s){const l=ML[p.goal][s],f=l.filter(m=>!allergic(m,p));return f.length?f:l}
function mkMeals(p){p.meals={};DAYS.forEach(d=>p.meals[d]=SL.map(()=>Math.floor(Math.random()*2)))}
const meal=(p,d,s)=>{const o=opts(p,s);return o[p.meals[d][s]%o.length]};
function streak(p){const set=new Set([...(p.hist||[]).map(h=>h.date),...Object.keys(p.done||{})]);let c=0,d=new Date();if(!set.has(iso(d)))d.setDate(d.getDate()-1);while(set.has(iso(d))){c++;d.setDate(d.getDate()-1)}return c}
const wkH=(p,k)=>(p.hist||[]).filter(h=>mon(h.date)==k);
function setP(v){view=v;ask=null;render()}
function nav(){const it=[["home","Accueil"],["train","Mon entraînement"],["plan","Mon planning"],["nutri","Nutrition"],["prog","Mes progrès"],["lib","Bibliothèque"],["coach","Coach"],["pdf","Mes PDF"],["set","Paramètres"]];
$("#nav").innerHTML=`<b>ULTIMATE FITNESS COACH</b><select aria-label="Profil" onchange="S.cur=+this.value;save();view='home';D={eq:[],days:[],goal:'gain'};step=0;render()">${[0,1].map(i=>`<option value="${i}" ${S.cur==i?"selected":""}>${S.p[i]?esc(S.p[i].n):"Profil "+(i+1)+" (vide)"}</option>`).join("")}</select>`+(P()?it.map(([k,l])=>`<a class="${view==k?"on":""}" onclick="setP('${k}')">${l}</a>`).join(""):"")}
function fld(k,l,t,o){if(t=="text"||t=="number"||t=="time")return `<label>${l}</label><input type="${t}" value="${esc(D[k]||"")}" oninput="D['${k}']=this.value">`;
if(t=="sel")return `<label>${l}</label><select onchange="D['${k}']=this.value"><option value="">—</option>${o.map(x=>`<option ${D[k]==x?"selected":""}>${x}</option>`).join("")}</select>`;
if(t=="multi")return `<label>${l}</label><div class="chips">${o.map(x=>`<span class="chip ${D[k].includes(x)?"on":""}" tabindex="0" onclick="tg('${k}','${x}')">${x}</span>`).join("")}</div>`;
return `<div class="g2"><div class="goal ${D.goal=="gain"?"on":""}" onclick="D.goal='gain';render()"><h2>Prise de poids et musculation</h2><p class="mu">Développer la musculature, la force et un physique harmonieux avec une alimentation suffisamment énergétique.</p></div><div class="goal ${D.goal=="loss"?"on":""}" onclick="D.goal='loss';render()"><h2>Perte de poids</h2><p class="mu">Améliorer la composition corporelle en préservant santé, force et masse musculaire. Sans restriction extrême.</p></div></div>`}
function tg(k,v){const a=D[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);render()}
const STEPS=[["Qui es-tu ?",[["n","Prénom","text"],["age","Âge","number"],["sex","Sexe (facultatif)","sel",["Homme","Femme","Autre"]],["h","Taille (cm)","number"],["w","Poids actuel (kg)","number"],["tw","Objectif de poids (facultatif)","number"]]],["Ton objectif",[["goal","","goal"]]],["Ton entraînement",[["lvl","Niveau","sel",["Débutant","Intermédiaire","Avancé"]],["exp","Expérience en musculation","text"],["eq","Matériel disponible","multi",[G,H,M,B]],["spw","Séances par semaine","sel",[2,3,4,5,6,7]],["dur","Durée par séance (min)","sel",[30,45,60,75,90]],["days","Jours disponibles","multi",DAYS],["inj","Blessures, douleurs, limitations","text"],["time","Heure habituelle","time"]]],["Alimentation et récupération",[["all","Allergies et intolérances (séparées par des virgules)","text"],["diet","Préférences alimentaires","text"],["bud","Budget alimentaire","sel",["Serré","Moyen","Confortable"]],["like","Aliments aimés et détestés","text"],["sleep","Sommeil et récupération","sel",["Mauvais","Moyen","Bon"]],["mot","Motivation et objectifs personnels","text"]]]];
function onb(){const last=STEPS.length;if(step==last){return `<h1>Récapitulatif</h1><div class="card">${[["Prénom",D.n],["Âge",D.age],["Taille / poids",D.h+" cm / "+D.w+" kg"],["Objectif",gname(D)],["Niveau",D.lvl],["Séances",D.spw+" × "+D.dur+" min"],["Jours",D.days.join(", ")],["Matériel",D.eq.join(", ")],["Blessures",D.inj],["Allergies",D.all]].map(([a,b])=>`<div class="row"><span class="mu" style="width:120px">${a}</span><span>${esc(b||"—")}</span></div>`).join("")}</div>${minor(D)?`<div class="warn">Tu as moins de 18 ans : aucun déficit calorique ni comptage de calories ne sera proposé. Pour tout objectif de poids, parle-en à un médecin ou à un diététicien.</div>`:""}<div class="row"><button class="s" onclick="step--;render()">Retour</button><button onclick="fin()">Confirmer et générer mon programme</button></div>`}
const [t,f]=STEPS[step];return `<h1>${t}</h1><p class="mu">Étape ${step+1} sur ${last}</p><div class="bar"><i style="width:${(step+1)/last*100}%"></i></div><div class="card">${f.map(x=>fld(...x)).join("")}</div><div class="row">${step?`<button class="s" onclick="step--;render()">Retour</button>`:""}<button onclick="nx()">Suivant</button></div>`}
function nx(){if(step==0&&(!D.n||!(+D.age>5)||!(+D.h>80)||!(+D.w>20)))return toast("Renseigne prénom, âge, taille et poids valides.");if(step==2&&(!D.lvl||!D.spw||!D.dur))return toast("Choisis niveau, séances et durée.");if(step==2&&!D.days.length)D.days=[...DAYS];step++;render()}
function fin(){const p={...D,hist:[],wl:[{d:today(),w:+D.w}],done:{},rem:{on:false,t:D.time||"18:00"}};p.spw=+p.spw;p.dur=+p.dur;mkPlan(p);mkMeals(p);S.p[S.cur]=p;save();D={eq:[],days:[],goal:"gain"};step=0;view="home";render();toast("Programme généré")}
function nextS(p){for(let i=0;i<7;i++){const d=DAYS[(tdi()+i)%7];if(PRE[p.plan[d]]&&PRE[p.plan[d]].length)return [d,p.plan[d],i]}return null}
function home(p){const k=mon(new Date()),w=wkH(p,k),tot=(p.hist||[]).reduce((a,h)=>a+h.dur,0),lw=p.wl[p.wl.length-1].w,l=p.hist[p.hist.length-1],n=nextS(p),td=DAYS[tdi()];
return `<h1>Bonjour ${esc(p.n)}</h1><p class="mu">Objectif : ${gname(p)}</p><div class="g">${[["Poids",lw+" kg"],["Séances cette semaine",w.length+" / "+p.spw],["Temps total",tot+" min"],["Jours actifs d’affilée",streak(p)]].map(([a,b])=>`<div class="card"><div class="big">${b}</div><div class="mu">${a}</div></div>`).join("")}</div>
<div class="g2"><div class="card"><h3>Dernière séance</h3>${l?`<p>${l.date} : ${esc(l.title)}, ${l.dur} min</p>`:`<p class="mu">Pas encore de séance. Lance la première.</p>`}</div><div class="card"><h3>Prochaine séance</h3>${n?`<p>${n[2]?n[0]:"Aujourd’hui"} : ${n[1]}</p>`:`<p class="mu">Aucune séance planifiée.</p>`}</div></div>
<button onclick="${n&&n[2]==0?`launch('${n[0]}')`:"setP('train')"}">Commencer mon entraînement</button>
${p.rem.on?`<p class="mu">Rappel configuré à ${esc(p.rem.t)} (visible dans l’app uniquement).</p>`:""}
<h2 style="margin-top:20px">Ma semaine</h2><div class="g">${DAYS.map(d=>`<div class="card" style="${d==td?"border-color:var(--ac)":""}"><b>${d.slice(0,3)}</b><div class="mu">${p.plan[d]}</div>${p.done[wd(d)]?`<div style="color:var(--ac)">✔ fait</div>`:""}</div>`).join("")}</div>
${p.mot?`<div class="card"><h3>Mes objectifs personnels</h3><p>${esc(p.mot)}</p></div>`:""}`}

function train(p){return `<h1>Que veux-tu faire aujourd’hui ?</h1><div class="g2"><div class="card"><h2>Qu’est-ce que tu veux muscler ?</h2><div class="chips">${MU.map(m=>`<span class="chip ${(flt.sel||[]).includes(m)?"on":""}" tabindex="0" onclick="selM('${m}')">${m}</span>`).join("")}</div><br><button onclick="goSel()">Générer ma séance</button></div><div class="card"><h2>Créer mon planning de la semaine</h2><p class="mu">Un planning adapté à tes jours, ton niveau et ton matériel.</p><button onclick="setP('plan')">Ouvrir mon planning</button></div></div>${flt.pre?`<div class="card"><h2>Séance proposée</h2>${flt.pre.map((e,i)=>exCard(e,p,i)).join("")}<p class="mu">Durée estimée : ${flt.pre.reduce((a,e)=>a+e.sets*(1+e.rest/60),0).toFixed(0)} min</p><button onclick="startS(flt.pre,'Séance libre')">Commencer la séance</button></div>`:""}`}

function startS(items,title,day){R={items:JSON.parse(JSON.stringify(items)),title,day,t0:Date.now(),rt:0};R.items.forEach(e=>{e.log=Array.from({length:e.sets},()=>({w:"",r:"",ok:false}))});view="run";clearInterval(tick);tick=setInterval(tk,1000);render()}

function run(p){const tot=R.items.reduce((a,e)=>a+e.sets,0),dn=R.items.reduce((a,e)=>a+e.log.filter(l=>l.ok).length,0);

${R.items.map((e,i)=>`<div class="card"><div class="row"><h3 class="grow">${e.n}</h3><button class="s" onclick="swapE(${i})">Remplacer</button><button class="s" onclick="R.items.splice(${i},1);render()">Retirer</button></div><div class="mu">${e.reps} reps · repos ${e.rest} s · ${e.q}</div>${e.log.map((l,j)=>`<div class="row setrow" style="margin-top:6px"><span class="mu">Série ${j+1}</span><input type="number" placeholder="kg" aria-label="Charge" value="${l.w}" oninput="R.items[${i}].log[${j}].w=this.value"><input type="number" placeholder="reps" aria-label="Répétitions" value="${l.r}" oninput="R.items[${i}].log[${j}].r=this.value"><button class="s ${l.ok?"ok":""}" onclick="vs(${i},${j})">${l.ok?"Validée":"Valider"}</button></div>`).join("")}</div>`).join("")}
<label>Sensations</label><textarea id="feel" rows="2"></textarea><br><div class="row"><button onclick="endS()">Terminer la séance</button><button class="s" onclick="if(R){clearInterval(tick);R=null}setP('home')">Abandonner</button></div>`}
function vs(i,j){const l=R.items[i].log[j];l.ok=!l.ok;if(l.ok)R.rt=R.items[i].rest;render()}
function swapE(i){const p=P(),e=R.items[i],o=ex4(p,e.m);if(!o.length)return;const k=o.findIndex(x=>x[0]==e.n),n=o[(k+1)%o.length],l=e.log;R.items[i]={...mk(n,p),sets:e.sets,log:l}; render()}
function endS(){const p=P(),dur=Math.max(1,Math.round((Date.now()-R.t0)/60000)),feel=($("#feel")||{}).value||"",ex=[],prs=[];
R.items.forEach(e=>{const s=e.log.filter(l=>l.ok).map(l=>({w:+l.w||0,r:+l.r||0}));if(!s.length)return;ex.push({n:e.n,s});const mx=Math.max(...s.map(x=>x.w)),old=Math.max(0,...p.hist.flatMap(h=>h.ex.filter(x=>x.n==e.n).flatMap(x=>x.s.map(y=>y.w))));if(mx>0&&mx>old)prs.push(e.n+" : "+mx+" kg")});

p.hist.push({date:today(),title:R.title,dur,ex,feel,prs});if(R.day)p.done[wd(R.day)]=true;save();sumR={dur,ex,prs,feel};clearInterval(tick);R=null;view="sum";render()}
function sum(){const s=sumR;return `<h1>Séance terminée</h1><div class="card"><div class="big">${s.dur} min</div>${s.ex.map(e=>`<p><b>${e.n}</b><br><span class="mu">${e.s.map(x=>x.r+"×"+x.w+" kg").join(" · ")}</span></p>`).join("")}${s.prs.length?`<h3>Records personnels</h3>${s.prs.map(x=>`<p>🏆 ${x}</p>`).join("")}`:""}${s.feel?`<p class="mu">Sensations : ${esc(s.feel)}</p>`:""}<p class="mu">Enregistrée dans ton historique.</p></div><button onclick="setP('home')">Retour à l’accueil</button>`}
function plan(p){return `<h1>Mon planning</h1><p class="mu">Change la séance d’un jour pour déplacer, remplacer, ajouter ou supprimer (Repos). Évite de solliciter les mêmes muscles deux jours de suite.</p>${DAYS.map(d=>{const ms=PRE[p.plan[d]]||[];return `<div class="card"><div class="row"><b style="width:90px">${d}</b><select class="grow" onchange="chgDay('${d}',this.value)">${Object.keys(PRE).map(x=>`<option ${p.plan[d]==x?"selected":""}>${x}</option>`).join("")}</select>${ms.length?`<button class="s" onclick="openDay=openDay=='${d}'?null:'${d}';render()">Détail</button><button onclick="launch('${d}')">Lancer</button>`:""}<button class="s ${p.done[wd(d)]?"ok":""}" onclick="P().done[wd('${d}')]=!P().done[wd('${d}')];save();render()">${p.done[wd(d)]?"Fait":"Valider"}</button></div>${openDay==d?p.det[d].map(e=>exCard(e,p)).join("")+`<button class="s" onclick="chgDay('${d}','${p.plan[d]}')">Autres exercices</button>`:""}${tclash(p,d)}</div>`}).join("")}<button onclick="mkPlan(P());save();render()">Régénérer tout le planning</button> <button class="s" onclick="pdfProg()">Exporter en PDF</button>`}
function tclash(p,d){const i=DAYS.indexOf(d),n=DAYS[(i+1)%7],a=PRE[p.plan[d]]||[],b=PRE[p.plan[n]]||[];const c=a.some(x=>b.includes(x)&&x!="Corps complet");return c?`<div class="warn" style="margin:8px 0 0">Mêmes muscles sollicités le lendemain (${n}).</div>`:""}

<div class="card"><h3>Hydratation et habitudes</h3><p class="mu">${p.goal=="gain"?"1,5 à 2 L d’eau par jour, des repas réguliers et un dîner riche en protéines. Ajoute une collation si tu n’as pas faim aux repas.":"1,5 à 2 L d’eau par jour, légumes à chaque repas, protéines à chaque repas, pas de régime extrême."}</p></div>
${DAYS.map(d=>`<div class="card"><h3>${d}</h3>${SL.map((s,i)=>{const m=meal(p,d,i);return `<div style="border-top:1px solid var(--bd);padding:8px 0"><div class="row"><span class="mu" style="width:140px">${s}</span><b class="grow">${m[0]}</b><button class="s" onclick="P().meals['${d}'][${i}]++;save();render()">Autre idée</button></div><div class="mu">${m[1]} · ${m[2]} min${mn?"":" · ≈ "+m[3]+" kcal, "+m[4]+" g prot."}${m[5]?" · Allergènes : "+m[5]:" · Sans allergène courant"}</div></div>`}).join("")}</div>`).join("")}<div class="row"><button onclick="pdfNut()">Télécharger le plan en PDF</button><button class="s" onclick="mkMeals(P());save();render()">Tout régénérer</button></div>`}
function shop(p){const c={};DAYS.forEach(d=>SL.forEach((s,i)=>{const m=meal(p,d,i);c[m[0]]=c[m[0]]||[0,m[1]];c[m[0]][0]++}));return Object.entries(c).map(([n,[k,i]])=>k+" × "+n+" : "+i)}
function chart(pts,lab){if(pts.length<1)return `<p class="mu">Aucune donnée.</p>`;const mx=Math.max(...pts.map(x=>x[1]),1),mn=lab=="kg"?Math.min(...pts.map(x=>x[1]))-1:0,W=600,Hh=160,sx=pts.length>1?(W-40)/(pts.length-1):0,Y=v=>Hh-20-((v-mn)/(mx-mn||1))*(Hh-40);
return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto" role="img" aria-label="Graphique"><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${pts.map((x,i)=>(20+i*sx)+","+Y(x[1])).join(" ")}"/>${pts.map((x,i)=>`<circle cx="${20+i*sx}" cy="${Y(x[1])}" r="4" fill="var(--ac)"><title>${esc(x[0])} : ${x[1]} ${lab}</title></circle><text x="${20+i*sx}" y="${Hh-4}" font-size="10" text-anchor="middle" fill="var(--mu)">${esc(String(x[0]).slice(-5))}</text>`).join("")}</svg>`}
function prs(p){const m={};p.hist.forEach(h=>h.ex.forEach(e=>e.s.forEach(s=>{if(s.w>(m[e.n]||0))m[e.n]=s.w})));return Object.entries(m).filter(x=>x[1]>0)}
function prog(p){const wk=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(d.getDate()-7*i);const k=mon(d);wk.push([k,wkH(p,k).length])}const tot=p.hist.reduce((a,h)=>a+h.dur,0);
return `<h1>Mes progrès</h1><div class="g2"><div class="card"><h3>Séances par semaine</h3>${chart(wk,"séances")}</div><div class="card"><h3>Poids</h3>${chart(p.wl.map(x=>[x.d,x.w]),"kg")}<div class="row"><input id="nw" type="number" step="0.1" placeholder="Poids (kg)" aria-label="Nouveau poids" style="width:130px"><button onclick="addW()">Ajouter</button></div></div></div>
<div class="card"><h3>Comparaison</h3><p>Cette semaine : ${wk[5][1]} séance(s). Semaine précédente : ${wk[4][1]}. Temps total passé à t’entraîner : ${tot} min. Objectif hebdomadaire : ${p.spw}. ${wk[5][1]>=p.spw?"Objectif atteint.":""}</p></div>

function lib(p){const l=EX.filter(e=>(!flt.m||e[1]==flt.m)&&(!flt.e||e[2]==flt.e)&&(!flt.l||e[3]==flt.l));const sel=(k,a,t)=>`<select aria-label="${t}" onchange="flt.${k}=this.value;render()"><option value="">${t}</option>${a.map(x=>`<option value="${x[0]}" ${flt[k]==x[0]?"selected":""}>${x[1]}</option>`).join("")}</select>`;

function coach(p){const t=[];const wk=wkH(p,mon(new Date())).length;
if(!p.hist.length)t.push("Commence par ta première séance : l’important est la régularité, pas l’intensité.");

async function mkpdf(title,blocks,file){if(!window.jspdf)return toast("Bibliothèque PDF indisponible.");const p=P(),d=new jspdf.jsPDF({unit:"mm",format:"a4"});

if(Array.isArray(r)&&ri==0){d.setFillColor(225,245,232);d.rect(15,y-4,180,hh,"F");d.setFont(undefined,"bold")}else d.setFont(undefined,"normal");
ls.forEach((l,i)=>d.text(l,15+i*w+1,y,{baseline:"alphabetic"}));y+=hh;if(Array.isArray(r)){d.setDrawColor(220);d.line(15,y-3.5,195,y-3.5)}});y+=6}
